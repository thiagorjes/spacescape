<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo | UltimateForce</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/atualiza_dados.css">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <!-- Tela de Carregamento Inicial -->
    <div id="loading-screen" class="flex flex-col items-center justify-center">
        <div class="loader"></div>
        <p class="mt-4 text-gray-600">Verificando autenticação...</p>
    </div>

    <!-- Mensagem para usuário não logado -->
    <div id="login-prompt" class="hidden text-center">
        <h2 class="text-2xl font-bold text-gray-800">Acesso Negado</h2>
        <p class="text-gray-600 mt-2">Você precisa fazer login para jogar.</p>
        <a href="login.html" class="mt-4 inline-block px-6 py-2 text-white bg-indigo-600 rounded-lg hover:bg-indigo-700">Ir para Login</a>
    </div>

    <!-- Container Principal do Jogo (quando logado) -->
    <main id="game-container" class="hidden w-full max-w-2xl p-8 space-y-6 bg-white rounded-xl shadow-lg">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Painel do Jogo</h1>
                <p id="welcome-message" class="text-gray-600">Bem-vindo(a)!</p>
            </div>
            <a href="login.html" id="logout-button-game" class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700">Sair</a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
            <div class="bg-gray-100 p-4 rounded-lg">
                <h3 class="text-sm font-medium text-gray-500">Fase Atual</h3>
                <p id="current-level" class="text-2xl font-bold text-gray-800">--</p>
            </div>
            <div class="bg-gray-100 p-4 rounded-lg">
                <h3 class="text-sm font-medium text-gray-500">Combustível</h3>
                <p id="current-fuel" class="text-2xl font-bold text-gray-800">--</p>
            </div>
            <div class="bg-gray-100 p-4 rounded-lg">
                <h3 class="text-sm font-medium text-gray-500">Mortes</h3>
                <p id="current-deaths" class="text-2xl font-bold text-gray-800">--</p>
            </div>
        </div>

        <div>
            <h3 class="text-lg font-semibold text-gray-700">Ações</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-2">
                <button id="simulate-level-end-btn" class="w-full px-4 py-3 font-medium text-white bg-green-600 rounded-lg hover:bg-green-700 transition-colors">Simular Fim de Fase</button>
                <button id="simulate-no-fuel-btn" class="w-full px-4 py-3 font-medium text-white bg-yellow-500 rounded-lg hover:bg-yellow-600 transition-colors">Simular Fim de Combustível</button>
                <button id="save-progress-btn" class="w-full px-4 py-3 font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors">Salvar Progresso Manual</button>
                <button id="load-progress-btn" class="w-full px-4 py-3 font-medium text-white bg-gray-500 rounded-lg hover:bg-gray-600 transition-colors">Carregar Progresso</button>
            </div>
            <p id="status-message" class="text-center text-sm text-green-600 mt-4 h-5"></p>
        </div>
    </main>
    
    <!-- Script do Jogo -->
    <script type="module" src="assets/js/atualiza_dados.js"></script>
</body>
</html>
