<div id="modal-close" class="close-button">×</div>
<h1 class="text-2xl font-bold text-center text-gray-800" data-i18n="email_verification.title">Verifique seu E-mail</h1>
<p class="text-sm text-center text-gray-600 my-4" data-i18n="email_verification.message">
    Um link de verificação foi enviado para o seu e-mail. Por favor, verifique sua caixa de entrada (e a pasta de spam) para continuar.
</p>
<button id="resend-verification-button" class="w-full px-4 py-2 text-lg font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 transition-colors duration-300" data-i18n="email_verification.resend">Reenviar E-mail</button>
<p id="auth-error" class="text-sm text-center text-red-500 mt-2 h-4"></p>
<p class="mt-6 text-sm text-center text-gray-600">
    <a href="#" id="logout-from-verify" class="font-medium text-indigo-600 hover:underline" data-i18n="email_verification.logout">Logout</a>
</p>
