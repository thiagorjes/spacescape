<div id="modal-background" class="modal-overlay">
    <div id="profile-stats" class="modal-content">
        <div id="loading-screen" class="loading-container">
            <div class="loader"></div>
            <p class="loading-text">Loading...</p>
        </div>

        <!-- Container de Login -->
        <div id="login-container" class="login-modal bg-white rounded-xl hidden">
            <!-- Conteúdo é inserido dinamicamente pelo JS -->
        </div>

        <!-- Container de Boas-vindas (Logado) -->
        <div id="welcome-container" class="welcome-modal hidden">
            <div id="modal-close" class="close-button">×</div>
            <div class="welcome-content">
                <div class="welcome-header">
                    <div class="welcome-icon">
                        <i class="fas fa-user-astronaut"></i>
                    </div>
                    <h2 class="welcome-title" data-i18n="welcome.title">Welcome</h2>
                    <div class="welcome-glow"></div>
                </div>
                <div class="user-info">
                    <p id="user-name" class="user-display-name"></p>
                    <div class="user-status">
                        <span class="status-dot"></span>
                        <span class="status-text" data-i18n="welcome.online">Online</span>
                    </div>
                </div>
                <div class="welcome-actions">
                    <!-- <button id="continue-button" class="action-btn primary-btn">
                        <i class="fas fa-play"></i>
                        Continue Game
                    </button>
                    <button id="profile-button" class="action-btn secondary-btn">
                        <i class="fas fa-user"></i>
                        Profile
                    </button> -->
                    <button id="logout-button" class="action-btn logout-btn">
                        <i class="fas fa-sign-out-alt"></i>
                        <span data-i18n="welcome.logout">Logout</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
