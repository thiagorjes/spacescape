<div id="modal-close" class="close-button">×</div>
<h1 class="text-2xl font-bold text-center text-gray-800" data-i18n="username.title">Crie seu Username</h1>
<p class="text-sm text-center text-gray-600 mb-4" data-i18n="username.subtitle">This name will be displayed to other players.</p>
<form id="username-form" class="space-y-4">
    <div>
        <label for="username-input" class="text-sm font-medium text-gray-700" data-i18n="username.username">Username</label>
        <input id="username-input" name="username" type="text" required class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" data-i18n-placeholder="username.username_placeholder" placeholder="SeuUsername123" minlength="3" maxlength="15" pattern="[a-zA-Z0-9_]+">
        <p class="text-xs text-gray-500 mt-1" data-i18n="username.rules">3-15 characters, only letters, numbers and _.</p>
    </div>
    <button type="submit" class="w-full px-4 py-2 text-lg font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700" data-i18n="username.save">Salvar e Continuar</button>
</form>
<p id="auth-error" class="text-sm text-center text-red-500 mt-2 h-4"></p>
