<div id="modal-close" class="close-button">×</div>
<h1 class="text-2xl font-bold text-center text-gray-800" data-i18n="register.title">Register</h1>
<form id="register-form" class="space-y-4">
    <div>
        <label for="register-name" class="text-sm font-medium text-gray-700" data-i18n="register.full_name">Full Name</label>
        <input id="register-name" name="name" type="text" required class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" data-i18n-placeholder="register.name_placeholder" placeholder="Your name">
    </div>
    <div>
        <label for="register-email" class="text-sm font-medium text-gray-700" data-i18n="register.email">Email</label>
        <input id="register-email" name="email" type="email" required class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" data-i18n-placeholder="register.email_placeholder" placeholder="your@email.com">
    </div>
    <div>
        <label for="register-password" class="text-sm font-medium text-gray-700" data-i18n="register.password">Password (mín. 6 chars)</label>
        <input id="register-password" name="password" type="password" required class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" data-i18n-placeholder="register.password_placeholder" placeholder="********">
    </div>
    <button type="submit" class="w-full px-4 py-2 text-lg font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors duration-300" data-i18n="register.create_account">Create account</button>
</form>
<p id="auth-error" class="text-sm text-center text-red-500 mt-2 h-4"></p>
<p class="mt-6 text-sm text-center text-gray-600">
    <span data-i18n="register.login_link">Already have an account?</span> <a href="#" id="show-login" class="font-medium text-indigo-600 hover:underline" data-i18n="register.login">Log in</a>
</p>
