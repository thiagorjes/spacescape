<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="manifest" href="/manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Scape</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/login.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <div id="app">
        <!-- Header will be loaded here -->
        <header id="header-container"></header>

        <!-- Main Content -->
        <main class="content">
            <!-- Mobile View -->
            <div id="mobile-view" class="mobile-view">
                <div class="starfield-container">
                    <canvas id="starfield-mobile" class="starfield-canvas"></canvas>
                </div>

                <div class="title-container">
                    <h1 class="game-title" data-i18n="home.title">Space Scape</h1>
                </div>

                <div class="rocket-container">
                    <div id="rocket-mobile-container"></div>
                </div>

                <div class="button-container">
                    <button id="launch-btn-mobile" class="launch-button">Identify yourself</button>
                </div>
            </div>

            <!-- Desktop View -->
            <div id="desktop-view" class="desktop-view">
                <div class="desktop-content">
                    <div class="starfield-container-desktop">
                        <canvas id="starfield-desktop" class="starfield-canvas-desktop"></canvas>
                    </div>

                    <div class="title-container-desktop">
                    <h1 class="game-title-desktop" data-i18n="home.title">Space Scape</h1>
                    </div>

                    <div class="rocket-container-desktop">
                        <div id="rocket-desktop-container"></div>
                    </div>

                    <div class="button-container-desktop">
                        <button id="launch-btn-desktop" class="launch-button-desktop">Identify yourself</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer"></footer>
    </div>
    <!-- Modal will be loaded here -->
    <div id="modal-container"></div>
    <div id="ranking-container"></div>

    <script type="module" src="assets/js/component-loader.js"></script>
    <script type="module">
        
        // Load common components
        import { ComponentLoader } from './assets/js/component-loader.js';

        document.addEventListener('DOMContentLoaded', async () => {
            const loader = new ComponentLoader();
            
            // Load header
            await loader.replaceWithComponent('header', '#header-container');

            // Load login modal
            await loader.replaceWithComponent('login-modal', '#modal-container');

            // Load rocket components
            await loader.replaceWithComponent('rocket', '#rocket-mobile-container');
            await loader.replaceWithComponent('rocket', '#rocket-desktop-container');

            // Load ranking component
            await loader.replaceWithComponent('ranking', '#ranking-container');
            
            document.dispatchEvent(new Event('componentsLoaded'));
        });
    </script>
    <script type="module" src="assets/js/scripts.js"></script>
    <script type="module" src="assets/js/login.js"></script>
    <script type="module" src="assets/js/auth-utils.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('Service Worker registrado com sucesso:', registration);
                    })
                    .catch(error => {
                        console.log('Falha ao registrar o Service Worker:', error);
                    });
            });
        }
    </script>
</body>

</html>
