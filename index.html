<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Scape</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/login.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <div id="app">
        <div class="header">
            <div class="user-name">Login</div>
            <div class="profile"><img src="assets/img/account.svg" /></div>
        </div>
        <!-- Mobile View -->
        <div id="mobile-view" class="mobile-view">
            <div class="starfield-container">
                <canvas id="starfield-mobile" class="starfield-canvas"></canvas>
            </div>

            <div class="title-container">
                <h1 class="game-title">Space Scape</h1>
            </div>

            <div class="rocket-container">
                <svg id="rocket-mobile" class="rocket-svg" viewBox="0 0 24 36" xmlns="http://www.w3.org/2000/svg">
                    <polygon id="flame" points="12,21 9,27 15,27" fill="#ffcc00" opacity="0" />
                    <polygon points="12,3 6,21 18,21" fill="#b0b0b0" stroke="#555555" stroke-width="1.2" />
                    <polygon points="7,21 3,21 7,17" fill="#808080" stroke="#555555" stroke-width="1.2" />
                    <polygon points="17,21 21,21 17,17" fill="#808080" stroke="#555555" stroke-width="1.2" />
                </svg>
            </div>

            <div class="button-container">
                <button id="launch-btn-mobile" class="launch-button">Identify yourself</button>
            </div>
        </div>

        <!-- Desktop View -->
        <div id="desktop-view" class="desktop-view">
            <div class="desktop-content">
                <div class="starfield-container-desktop">
                    <canvas id="starfield-desktop" class="starfield-canvas-desktop"></canvas>
                </div>

                <div class="title-container-desktop">
                    <h1 class="game-title-desktop">Space Scape</h1>
                </div>

                <div class="rocket-container-desktop">
                    <svg id="rocket-desktop" class="rocket-svg-desktop" viewBox="0 0 24 36"
                        xmlns="http://www.w3.org/2000/svg">
                        <polygon id="flame" points="12,21 9,27 15,27" fill="#ffcc00" opacity="0" />
                        <polygon points="12,3 6,21 18,21" fill="#b0b0b0" stroke="#555555" stroke-width="1.2" />
                        <polygon points="7,21 3,21 7,17" fill="#808080" stroke="#555555" stroke-width="1.2" />
                        <polygon points="17,21 21,21 17,17" fill="#808080" stroke="#555555" stroke-width="1.2" />
                    </svg>
                </div>

                <div class="button-container-desktop">
                    <button id="launch-btn-desktop" class="launch-button-desktop">Identify yourself</button>
                </div>
            </div>
        </div>
    </div>
    <div id="modal-background" class="flex flex-col items-center justify-center h-screen ">
        <div id="profile-stats" >
            <div id="loading-screen" class="flex flex-col items-center justify-center">
                <div class="loader"></div>
                <p class="mt-4 text-gray-600">Carregando...</p>
            </div>

            <!-- Container de Login -->
            <div id="login-container" class="hidden flex flex-col items-center justify-center bg-white rounded-xl shadow-lg">
                <!-- Conteúdo é inserido dinamicamente pelo JS -->
            </div>

            <!-- Container de Boas-vindas (Logado) -->
            <div id="welcome-container"
                class="hidden text-center w-full max-w-md p-8 space-y-6 bg-white rounded-xl shadow-lg">
                <div id="modal-close">x</div>
                <h2 class="text-3xl font-bold text-gray-800">Bem-vindo(a)!</h2>
                <p id="user-name" class="text-xl text-gray-600"></p>
                <button id="logout-button"
                    class="w-full px-4 py-2 text-lg font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-colors duration-300">
                    Sair (Logout)
                </button>
            </div>
        </div>
    </div>
    <script type="module" src="assets/js/scripts.js"></script>
    <script type="module" src="assets/js/login.js"></script>
    <script type="module" src="assets/js/auth-utils.js"></script>
</body>

</html>
